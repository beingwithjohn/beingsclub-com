name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site-and-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: practice-log/package-lock.json
      - run: npm ci
        working-directory: practice-log
      - run: npm test
        working-directory: practice-log
      - run: npm run check
        working-directory: practice-log
      - run: node members-app/app/build.js
      - run: python3 build/verify.py
