<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#FDFCF9;font-family:'Host Grotesk',system-ui,-apple-system,sans-serif;color:#171916;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;}
  img{display:block;max-width:100%;}
  a{color:#171916;text-decoration:none;}
  a:hover{color:#171916;}
  ::selection{background:#F2ECFF;color:#171916;}
  @keyframes bc-fade-in{to{opacity:1;}}
  body:not(:has(.bc-layer)){opacity:0;animation:bc-fade-in 420ms cubic-bezier(.22,1,.36,1) 60ms forwards;}
  @media (prefers-reduced-motion:reduce){body:not(:has(.bc-layer)){opacity:1;animation:none;}}
  #bc-tagline{white-space:nowrap;max-width:100%;}
  @media (max-width:640px){#bc-tagline{white-space:normal;max-width:30ch;}}
</style>
<script src="page-transitions.js"></script>
</helmet>

<div style="height:100svh;display:flex;flex-direction:column;background:#FDFCF9;position:relative;">
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(22px,4vh,48px);padding:clamp(28px,6vh,72px) clamp(24px,8vw,120px);min-height:0;overflow:hidden;">
    <div ref="{{ logoRef }}" role="img" aria-label="Beings Club" style="width:min(760px,88vw);max-height:100%;display:flex;align-items:center;justify-content:center;line-height:0;flex:0 1 auto;min-height:0;"><img src="assets/beings-logo-outline.svg" alt="Beings Club" style="width:100%;height:auto;max-height:100%;object-fit:contain;"></div>
    <div style="display:grid;gap:10px;justify-items:center;text-align:center;flex:0 0 auto;max-width:100%;">
      <p style="margin:0;max-width:30ch;font-size:clamp(19px,2.8vh,26px);font-weight:600;line-height:1.3;letter-spacing:-0.022em;color:#171916;text-wrap:pretty;">A realisationhouse for the curious.</p>
      <p id="bc-tagline" style="margin:0;font-size:clamp(15px,2.05vw,18px);line-height:1.55;letter-spacing:-0.008em;color:#75726A;text-wrap:pretty;">We gather to realise what is possible — in ourselves, between us, and in the world.</p>
    </div>
  </div>

  <div onMouseLeave="{{ leave }}">
    <div style="padding:16px 40px;text-align:center;font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:#5A4B7C;background:#F2ECFF;border-top:1px solid rgba(38,34,26,0.10);">{{ line }}</div>
    <div style="display:flex;align-items:stretch;border-top:1px solid rgba(38,34,26,0.10);">
      <a href="Salons.dc.html" onMouseEnter="{{ enter_salons }}" style="flex:1;padding:24px 16px;text-align:center;font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;" style-hover="background:#5A4B7C;color:#FDFCF9;">Salons</a>
      <a href="Sits.dc.html" onMouseEnter="{{ enter_sits }}" style="flex:1;padding:24px 16px;text-align:center;font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;border-left:1px solid rgba(38,34,26,0.10);" style-hover="background:#5A4B7C;color:#FDFCF9;">Sits</a>
      <a href="About.dc.html" onMouseEnter="{{ enter_about }}" style="flex:1;padding:24px 16px;text-align:center;font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;border-left:1px solid rgba(38,34,26,0.10);" style-hover="background:#5A4B7C;color:#FDFCF9;">About</a>
      <a href="Join.dc.html" onMouseEnter="{{ enter_door }}" style="flex:1;padding:24px 16px;text-align:center;font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;border-left:1px solid rgba(38,34,26,0.10);" style-hover="background:#5A4B7C;color:#FDFCF9;">The Door</a>
    </div>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;gap:24px;padding:14px 40px;border-top:1px solid rgba(38,34,26,0.10);background:#F8F6F1;">
    <span style="font-size:11px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#75726A;">Beings Club</span>
    <div style="display:flex;align-items:center;gap:20px;">
      <a href="https://instagram.com/beings_club" target="_blank" rel="noopener" aria-label="Beings Club on Instagram" style="display:inline-flex;color:#75726A;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="19" height="19" rx="5"></rect><circle cx="12" cy="12" r="4.2"></circle><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"></circle></svg></a>
      <a href="https://x.com/beings_club" target="_blank" rel="noopener" aria-label="Beings Club on X" style="display:inline-flex;color:#75726A;"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24h-6.657l-5.214-6.817-5.966 6.817H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231 5.45-6.231Zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77Z"></path></svg></a>
      <a href="mailto:john@spacetobe.xyz" style="font-size:11px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:#75726A;">john@spacetobe.xyz</a>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  logoRef = React.createRef();
  state = { hover: null };

  componentDidMount() {
    const host = this.logoRef.current;
    if (!host) return;
    fetch('assets/beings-logo-outline.svg').then(r => r.text()).then(txt => {
      const wrap = document.createElement('div');
      wrap.innerHTML = txt;
      const svg = wrap.querySelector('svg');
      if (!svg) return;
      const img = host.querySelector('img');
      if (img) img.style.display = 'none';
      host.appendChild(svg);
      svg.removeAttribute('width'); svg.removeAttribute('height');
      svg.style.width = '100%'; svg.style.height = 'auto'; svg.style.maxHeight = '100%'; svg.style.display = 'block';
      const rings = Array.from(host.querySelectorAll('[data-ring]'));
      if (!rings.length) return;
      rings.forEach(p => {
        p.style.transition = 'stroke-width .3s cubic-bezier(.22,1,.36,1)';
        p.style.pointerEvents = 'none';
        p.dataset.baseWidth = p.getAttribute('stroke-width') || '';
      });
      const outer = rings.reduce((a, b) => (+b.getAttribute('data-ring') > +a.getAttribute('data-ring') ? b : a));
      outer.style.pointerEvents = 'fill';
      outer.addEventListener('mouseenter', () => rings.forEach(p => { p.style.strokeWidth = '6.5'; }));
      outer.addEventListener('mouseleave', () => rings.forEach(p => { p.style.strokeWidth = p.dataset.baseWidth || ''; }));
    }).catch(() => {});
  }

  renderVals() {
    const meta = {
      salons: 'Where curiosity connects',
      sits: 'For making meditation yours',
      about: 'Why Beings Club exists',
      door: 'Join the club'
    };
    const v = {
      logoRef: this.logoRef,
      line: this.state.hover ? meta[this.state.hover] : 'For the benefit of all beings',
      leave: () => this.setState({ hover: null })
    };
    Object.keys(meta).forEach(k => { v['enter_' + k] = () => this.setState({ hover: k }); });
    return v;
  }
}
</script>
</body>
</html>
