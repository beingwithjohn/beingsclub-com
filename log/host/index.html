<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- The log is a tool for the people in a Sit, not a page to be found. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Host · Practice Log</title>
  <meta name="theme-color" content="#FDFCF9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Practice">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <style>
/* The Practice Log.
 *
 * Palette, type and spacing follow beingsclub.com — the same tokens, the same
 * sentence-case headings at 600, the same hairlines, the same zero radius —
 * so the log reads as a room in the same house rather than a separate product.
 *
 * Two things are the log's own, because they carry meaning rather than style:
 *
 *   --you    the mark that means this one is yours. The site's violet, ringed
 *            in the site's lilac so it separates from ink at six pixels.
 *   --ink    another person practised. Everyone is the same weight of mark.
 *
 * The bundle's earlier amber (#FFAD54) is kept below as a one-line switch. It
 * is louder and reads faster; it is also a colour the site does not contain.
 */

:root {
  --paper: #FDFCF9;   /* the sheet */
  --stone: #F0EEE8;   /* ground behind the column */
  --warm:  #F8F6F1;   /* footer strips */
  --lilac: #F2ECFF;   /* bands, and the ring around your mark */
  --ink:   #171916;   /* text, buttons, another person's mark */
  --body:  #43403A;   /* body copy */
  --muted: #75726A;   /* eyebrows, captions */

  /* Your own mark, in two weights, because it sits on two grounds.
   *
   * On paper — the week dots — violet on lilac reads clearly. On the whole-run
   * squares it does not: those are ink at up to 82% and violet against them is
   * nearly invisible, which is the one thing the bundle's amber was good at.
   * So the edge takes violet's light companion instead, and pops on the dark
   * exactly where violet cannot.
   */
  --you:      #5A4B7C;              /* switch to #FFAD54 for the bundle's amber */
  --you-ring: var(--lilac);         /* with amber: rgba(255,173,84,.30) */
  --you-edge: var(--lilac);         /* with amber: #FFAD54 */

  --hair:   rgba(38, 34, 26, 0.10);
  --hair-2: rgba(38, 34, 26, 0.14);
  --dim:    rgba(38, 34, 26, 0.12);  /* not yet */

  --pad:   clamp(24px, 5vw, 40px);
  --pad-y: clamp(28px, 5vh, 48px);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  background: var(--stone);
  color: var(--body);
  font-family: 'Host Grotesk', system-ui, -apple-system, sans-serif;
  font-size: 17px;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
}

img { display: block; max-width: 100%; }
em { font-style: italic; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; text-align: left; }
[hidden] { display: none !important; }
a { color: var(--ink); text-decoration: none; }
a:hover { color: var(--you); }
::selection { background: var(--lilac); color: var(--ink); }

:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }

/* The page column, as on the site: paper on stone, hairline down both sides. */
.app {
  background: var(--paper);
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  max-width: 64rem;
  margin: 0 auto;
  border-left: 1px solid var(--hair);
  border-right: 1px solid var(--hair);
}

/* ---------------------------------------------------------------- type ---- */

h1, h2, h3 { font-weight: 600; color: var(--ink); text-wrap: pretty; }

.h1 { font-size: clamp(30px, 5vw, 48px); line-height: 1.15; letter-spacing: -0.028em; }
.h2 { font-size: clamp(24px, 3.4vw, 32px); line-height: 1.2;  letter-spacing: -0.025em; }

/* The question. The one place the log is allowed to be large. */
.ask { font-size: clamp(30px, 6vw, 44px); line-height: 1.1; letter-spacing: -0.03em; max-width: 15ch; }

.eyebrow {
  font-size: 11px; font-weight: 600; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--muted); line-height: 1.4;
}
.caps {
  font-size: 11px; font-weight: 600; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--muted); line-height: 1.4;
}
.lead  { font-size: 19px; line-height: 1.7; color: var(--body); text-wrap: pretty; }
.body  { font-size: 17px; line-height: 1.8; color: var(--body); text-wrap: pretty; }
.small { font-size: 16px; line-height: 1.65; color: var(--muted); text-wrap: pretty; }

/* --------------------------------------------------------------- chrome --- */

.bar {
  padding: 16px var(--pad);
  border-bottom: 1px solid var(--hair);
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
}
.brand {
  font-size: 11px; font-weight: 600; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--ink);
}
.barlab {
  font-size: 11px; font-weight: 600; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--muted);
}
.barlab.on { color: var(--you); }
.barlink { font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.barlink:hover { color: var(--you); }

/* ------------------------------------------------------------- combobox --- */
/* Searchable timezone. A native select type-aheads on the label only, so
   "UTC" could never find Europe/London — and the offset is the thing most
   people actually know about where they are. */

.combo { position: relative; }
.combo-list {
  position: absolute; left: 0; right: 0; top: calc(100% - 1px); z-index: 5;
  max-height: min(21rem, 44vh); overflow-y: auto;
  background: var(--paper); border: 1px solid var(--ink);
  list-style: none; margin: 0; padding: 0;
}
.combo-list li {
  padding: 11px 16px; cursor: pointer;
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  font-size: 16px; color: var(--ink); border-bottom: 1px solid var(--hair);
}
.combo-list li:last-child { border-bottom: 0; }
.combo-list li em { font-style: normal; color: var(--muted); font-size: 15px; white-space: nowrap; }
.combo-list li[aria-selected="true"], .combo-list li:hover { background: var(--lilac); }
.combo-list .none { color: var(--muted); cursor: default; }
.combo-list .none:hover { background: none; }

/* ---------------------------------------------------------------- menu ---- */
/* Everywhere you can go, in one place, reachable from every screen and in the
   way of none — which is what the private line to John was always meant to be. */

.menu-btn {
  display: inline-flex; flex-direction: column; justify-content: center; gap: 4px;
  width: 26px; height: 18px; flex: none; padding: 0;
}
.menu-btn span { display: block; height: 1px; width: 100%; background: var(--ink); transition: background .15s; }
.menu-btn:hover span { background: var(--you); }
.dark .menu-btn span { background: var(--paper); }

.scrim {
  position: fixed; inset: 0; background: rgba(23, 25, 22, 0.34);
  opacity: 0; transition: opacity .22s ease-out; z-index: 40;
}
.scrim.in { opacity: 1; }

.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 41;
  width: min(21rem, 86vw);
  background: var(--paper); border-left: 1px solid var(--hair-2);
  display: flex; flex-direction: column; overflow-y: auto;
  transform: translateX(101%);
  transition: transform .3s cubic-bezier(.22, 1, .36, 1);
}
.drawer.in { transform: none; }

.drawer .head {
  padding: 16px var(--pad); border-bottom: 1px solid var(--hair);
  display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
}
.drawer .item {
  display: block; width: 100%; text-align: left;
  padding: 18px var(--pad); border-bottom: 1px solid var(--hair);
  font-size: 17px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink);
  transition: background .15s;
}
.drawer .item small {
  display: block; font-size: 15px; font-weight: 400; color: var(--muted);
  letter-spacing: 0; margin-top: 2px;
}
.drawer .item:hover { background: var(--lilac); }
.drawer .item[aria-current="page"] { color: var(--you); }

/* Black is John, even here. The one item on ink is the one only he reads. */
.drawer .item.ink { background: var(--ink); color: var(--paper); border-bottom-color: var(--ink); }
.drawer .item.ink small { color: rgba(253, 252, 249, 0.6); }
.drawer .item.ink:hover { background: #22241f; }

.drawer .tail { margin-top: auto; padding: var(--pad) var(--pad) calc(var(--pad) + 8px); }

@media (prefers-reduced-motion: reduce) {
  .drawer { transition-duration: .01ms; }
  .scrim { transition-duration: .01ms; }
}

main { flex: 1; display: flex; flex-direction: column; }

.centre {
  flex: 1; display: flex; flex-direction: column; justify-content: center;
  align-items: center; text-align: center; gap: clamp(20px, 3.5vh, 34px);
  padding: var(--pad-y) var(--pad);
}
.join-front { gap: clamp(14px, 2vh, 22px); padding-block: clamp(18px, 3vh, 32px); }
.pad { padding: var(--pad-y) var(--pad); }

/* A column of measure inside the page column, centred as on the site rather
   than left-hugging a 64rem sheet. */
.narrow { width: 100%; margin-inline: auto; }

.join-how {
  width: min(100%, 38rem); border-top: 1px solid var(--hair);
  padding-top: clamp(18px, 3vh, 28px); text-align: left;
}
.join-how > .eyebrow { text-align: center; margin-bottom: 16px; }
.join-how ol {
  display: grid; gap: 7px; margin: 0; padding-left: 1.35rem;
}
.join-how li { color: var(--body); font-size: 15px; line-height: 1.55; padding-left: 4px; }
.join-how li::marker { color: var(--you); font-size: 13px; }
.join-how li b { font-weight: 600; }

@media (max-height: 760px) and (min-width: 700px) {
  .join-front { gap: 10px; padding-block: 12px; }
  .join-front .h1 { font-size: 40px; }
  .join-front .body { line-height: 1.6; }
  .join-front .field { padding-block: 11px; }
  .join-front .btn { padding: 13px; }
  .join-how { padding-top: 12px; }
  .join-how > .eyebrow { margin-bottom: 10px; }
  .join-how ol { gap: 4px; }
  .join-how li { line-height: 1.45; }
}

.band {
  padding: clamp(22px, 3.5vh, 32px) var(--pad);
  border-bottom: 1px solid var(--hair);
  background: var(--lilac);
}
.band p { font-size: clamp(20px, 2.8vw, 26px); font-weight: 600; letter-spacing: -0.025em; line-height: 1.25; color: var(--ink); }

.foot {
  padding: 16px var(--pad);
  border-top: 1px solid var(--hair);
  background: var(--warm);
  display: flex; justify-content: space-between; align-items: baseline;
  flex-wrap: wrap; gap: 6px 16px;
  font-size: 16px; color: var(--muted);
}
.foot > :last-child { text-align: right; }
.ul { color: var(--body); border-bottom: 1px solid var(--hair-2); }
.ul:hover { color: var(--you); border-bottom-color: var(--you); }
.danger-link { color: #7b302d; border-bottom-color: rgba(123,48,45,.35); }
.danger-link:hover { color: #5f201e; border-bottom-color: #5f201e; }

/* ------------------------------------------------------------ the tap ---- */

.tap {
  width: 100%; max-width: 240px; aspect-ratio: 1;
  border: 1px solid var(--ink); background: var(--warm);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  transition: transform 90ms ease-out, background 180ms ease-out, border-color 180ms ease-out;
}
.tap b { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
.tap i { font-style: normal; font-size: 16px; color: var(--muted); }
.tap:hover { background: var(--lilac); }
.tap.dip { transform: scale(.98); }
.tap.done { background: var(--you); border-color: var(--you); }
.tap.done b { font-size: 22px; color: var(--paper); }
.tap.done i { color: rgba(253, 252, 249, 0.72); }
@media (min-width: 48rem) { .tap { max-width: 272px; } }

.practice-now {
  padding: 3px 0 2px; color: var(--body); font-size: 16px;
  border-bottom: 1px solid var(--hair-2);
}
.practice-now:hover { color: var(--you); border-bottom-color: var(--you); }

.timer-panel {
  min-height: calc(100svh - 54px); max-width: 38rem;
  display: flex; flex-direction: column; justify-content: center; gap: 26px;
}
.timer-choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.timer-choices .chip { text-align: center; padding-inline: 8px; }
.timer-custom { display: grid; gap: 9px; }
.timer-custom > span:last-of-type { position: relative; display: block; }
.timer-custom .field { padding-right: 88px; }
.timer-custom i {
  position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
  font-style: normal; font-size: 16px; color: var(--muted); pointer-events: none;
}
.timer-custom small { font-size: 14px; line-height: 1.5; color: var(--muted); }
.timer-sound { border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); padding-block: 18px; }
.timer-running { min-height: calc(100svh - 54px); }
.timer-clock {
  font-size: clamp(64px, 16vw, 116px); font-weight: 500; line-height: 1;
  letter-spacing: -.055em; color: var(--ink); font-variant-numeric: tabular-nums;
}
.timer-actions { display: grid; gap: 8px; width: min(100%, 22rem); }
@media (max-width: 34rem) { .timer-choices { grid-template-columns: repeat(2, 1fr); } }

.fade { opacity: 0; transition: opacity .6s ease-out; }
.fade.in { opacity: 1; }
.rise { transform: translateY(14px); opacity: 0; transition: transform .3s ease-out, opacity .3s ease-out; }
.rise.in { transform: none; opacity: 1; }

/* ---------------------------------------------------------------- dots ---- */
/* Days across, one equal dot per person. Identity stays behind the interaction:
   pictures exist only in the card opened by hover, focus or tap. */

.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
.dot.did { background: var(--ink); }
.dot.me  { background: var(--you); box-shadow: 0 0 0 2px var(--you-ring); }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: stretch; }
.daycol {
  min-width: 0; display: grid; grid-template-rows: 84px 18px;
  gap: 7px; justify-items: center; align-items: end;
}
.daycol.future { opacity: .3; }
.presence-dots { display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 8px; }
.week-presence { width: 100%; min-height: 84px; padding: 8px 3px; align-content: end; }
.presence-dot {
  width: 10px; height: 10px; flex: 0 0 10px; border-radius: 50%; background: var(--ink);
  border: 0; padding: 0; cursor: pointer;
}
.presence-dot.mine { background: var(--you); box-shadow: 0 0 0 2px var(--you-ring); }
.presence-dot:hover, .presence-dot:focus-visible { outline: 2px solid var(--you); outline-offset: 3px; }
.dlab { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.dlab.today { color: var(--ink); }
.day-open { background: none; border: 0; padding: 3px 6px; margin: -3px -6px; cursor: pointer; }
.day-open:hover, .day-open:focus-visible { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

.presence-card {
  position: fixed; z-index: 80; width: min(17rem, calc(100vw - 24px));
  display: grid; grid-template-columns: 54px 1fr; gap: 13px; align-items: center;
  padding: 13px; background: var(--paper); color: var(--ink);
  border: 1px solid var(--hair-2); box-shadow: 0 12px 34px rgba(23,25,22,.16);
}
.presence-card b { display: block; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.presence-card p { margin: 3px 0 0; font-size: 14px; line-height: 1.45; color: var(--body); }
.presence-card p.quiet-line { color: var(--muted); }
.presence-photo, .profile-preview {
  width: 54px; height: 54px; overflow: hidden; display: inline-flex; align-items: center;
  justify-content: center; flex: 0 0 54px; background: var(--lilac); color: var(--you);
  font-size: 16px; font-weight: 700; letter-spacing: .06em;
}
.presence-photo img, .profile-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
.profile-edit { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

.legend { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 7px; font-size: 16px; color: var(--muted); }
.key { width: 8px; height: 8px; border-radius: 50%; }
.practice-giving {
  border-top: 1px solid var(--hair); padding: 13px var(--pad); display: flex;
  justify-content: center; gap: 5px 8px; flex-wrap: wrap; text-align: center;
  font-size: 13px; line-height: 1.5; color: var(--muted);
}
.practice-giving a { color: var(--body); border-bottom: 1px solid var(--hair-2); }
.practice-giving a:hover { color: var(--you); border-bottom-color: var(--you); }

/* --------------------------------------------------------------- forms ---- */

.field {
  width: 100%; border: 1px solid var(--hair-2); background: var(--paper);
  padding: 14px 16px; font-family: inherit; font-size: 17px; line-height: 1.6;
  color: var(--ink); outline: none; resize: none; border-radius: 0;
}
.field:focus { border-color: var(--ink); }
.field::placeholder { color: var(--muted); }

/* Keep the invitation threshold visible on a short laptop. */
@media (max-height: 760px) {
  .threshold-view { gap: 14px !important; }
  .threshold-view.pad { padding-block: 24px; }
  .threshold-view .body { line-height: 1.6; }
}

.btn {
  display: block; width: 100%; text-align: center; padding: 16px;
  font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
  background: var(--ink); color: var(--paper);
  transition: background .18s, color .18s;
}
.btn:hover { background: var(--you); color: var(--paper); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.danger-button { background: #7b302d; }
.btn.danger-button:hover:not([disabled]) { background: #5f201e; }
.btn.on-ink { background: var(--paper); color: var(--ink); }
.btn.on-ink:hover { background: var(--lilac); }

.quiet { display: block; width: 100%; text-align: center; padding: 10px; font-size: 16px; color: var(--muted); }
.quiet:hover { color: var(--you); }
.count { font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }

.chip {
  font-size: 16px; font-weight: 500; border: 1px solid var(--hair-2);
  padding: 9px 14px; color: var(--body); transition: background .15s, color .15s, border-color .15s;
}
.chip:hover { border-color: var(--ink); }
.chip.sel { border-color: var(--ink); background: var(--ink); color: var(--paper); }

.sw { width: 44px; height: 26px; background: var(--dim); position: relative; flex: none; transition: background .18s; }
.sw.on { background: var(--ink); }
.sw i { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: var(--paper); transition: left .18s; }
.sw.on i { left: 21px; }

.rows > div { padding: clamp(18px, 2.6vh, 24px) var(--pad); border-bottom: 1px solid var(--hair); }
.rowflex { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
.rowflex b { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
.rowflex p { font-size: 16px; color: var(--muted); line-height: 1.5; margin-top: 2px; }

.notes { display: grid; gap: 16px; }
.noterow { display: grid; gap: 2px; }
.noterow b { font-size: 16px; font-weight: 600; color: var(--ink); }
.noterow p { font-size: 17px; line-height: 1.6; color: var(--body); }

.reply-page { max-width: 46rem; margin-inline: auto; width: 100%; }
.reply-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
#reply-list { display: grid; gap: 18px; }
.reply-card {
  display: grid; gap: 13px; padding: clamp(20px, 3vw, 28px);
  border: 1px solid var(--hair-2); background: var(--warm);
}
.reply-card .h2 { max-width: 24ch; }
.reply-card .body { max-width: 42ch; white-space: pre-wrap; }
.reply-audio { min-height: 24px; display: flex; align-items: center; }
.reply-audio:empty { display: none; }
.reply-audio audio { width: min(100%, 32rem); }
.reply-card.private { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.reply-card.private .caps, .reply-card.private .small { color: rgba(253,252,249,.55); }
.reply-card.private .body, .reply-card.private .h2 { color: rgba(253,252,249,.88); }
.reply-card.private .ul { color: var(--lilac); border-bottom-color: rgba(242,236,255,.4); }

.frame { border: 1px solid var(--hair-2); padding: 20px; display: grid; gap: 8px; }

/* ------------------------------------------------------------ black is John */

.dark { background: var(--ink); color: var(--paper); min-height: 100svh; display: flex; flex-direction: column;
  max-width: 64rem; margin: 0 auto; }
.dark .bar { border-bottom: 1px solid rgba(253, 252, 249, 0.16); }
.dark .brand { color: var(--paper); }
.dark .h1, .dark .h2 { color: var(--paper); }
.dark .body, .dark .lead { color: rgba(253, 252, 249, 0.72); }
.dark .caps, .dark .eyebrow, .dark .barlink, .dark .small { color: rgba(253, 252, 249, 0.5); }
.dark .field { border-color: rgba(253, 252, 249, 0.3); background: transparent; color: var(--paper); }
.dark .field:focus { border-color: var(--paper); }
.dark .field::placeholder { color: rgba(253, 252, 249, 0.4); }
.dark .foot { background: var(--ink); border-top-color: rgba(253, 252, 249, 0.16); color: rgba(253, 252, 249, 0.5); }
.dark :focus-visible { outline-color: var(--lilac); }

/* An answer from John, sitting above the log. It never blocks the tap. */
.answer { background: var(--ink); color: var(--paper); padding: 20px var(--pad); display: grid; gap: 8px; }
.answer .caps { color: rgba(253, 252, 249, 0.5); }
.answer p { font-size: 17px; line-height: 1.6; color: rgba(253, 252, 249, 0.8); }
.answer a { color: var(--lilac); border-bottom: 1px solid rgba(242, 236, 255, 0.4); }

/* ----------------------------------------------------------- one breakpoint */

.dtitle { display: none; }

@media (min-width: 48rem) {
  /* The week and today's notes sit side by side when there is room. */
  .split { display: grid; grid-template-columns: 1.35fr 1fr; gap: clamp(24px, 4vw, 48px);
    padding: var(--pad-y) var(--pad); align-items: start; }
  .split > * { min-width: 0; }
  .main { display: grid; gap: clamp(28px, 4vh, 44px); align-content: start; }
  .dtitle {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    border-bottom: 1px solid var(--hair); padding-bottom: 10px; margin-bottom: 16px;
  }
  .dtitle b { font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink); }
  .dtitle span { font-size: 16px; color: var(--muted); }
}

@media (prefers-reduced-motion: reduce) {
  .tap, .fade, .rise { transition-duration: .2s !important; }
  .tap.dip { transform: none; }
}
  </style>
</head>
<body>
<div id="root"></div>
<script>
/* John's side. A plain list, on purpose.
 *
 * Ten people do not need an inbox with features: what is here is what only he
 * can do — read what people asked privately, answer it, grant the private line
 * for a course, see who has gone quiet, and remove a note. Nothing here is shown to anybody else, and the quiet-day
 * count in particular exists so he can reach out as a person, never so the
 * product can.
 */
(function () {
  'use strict';

  var API = 'https://practice-log.beingsclub.workers.dev';
  var KEY = 'bc_practice_log_v3';   // the same token the log stores
  var root = document.getElementById('root');
  var token = null;
  var tab = 'inbox';
  var hostAudioUrls = {};
  var MAX_RECORDING_MS = 20 * 60 * 1000;

  (function () {
    var m = location.search.match(/[?&]t=([^&#]+)/);
    if (m) {
      token = decodeURIComponent(m[1]);
      try {
        var L = JSON.parse(localStorage.getItem(KEY) || '{}');
        L.token = token;
        localStorage.setItem(KEY, JSON.stringify(L));
      } catch (e) {}
      try { history.replaceState({}, '', location.pathname); } catch (e) {}
    } else {
      try { token = (JSON.parse(localStorage.getItem(KEY) || '{}')).token || null; } catch (e) {}
    }
  })();

  function api(path, opts) {
    opts = opts || {};
    var headers = { authorization: 'Bearer ' + (token || '') };
    if (opts.body !== undefined) headers['content-type'] = 'application/json';
    return fetch(API + path, {
      method: opts.method || 'GET', headers: headers,
      body: opts.body === undefined ? undefined : JSON.stringify(opts.body)
    }).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    });
  }

  function apiForm(path, form) {
    return fetch(API + path, {
      method: 'POST',
      headers: { authorization: 'Bearer ' + (token || '') },
      body: form
    }).then(function (r) {
      if (!r.ok) return r.json().catch(function () { return {}; }).then(function (j) {
        throw new Error(j.error || ('http ' + r.status));
      });
      return r.json();
    });
  }

  function apiAudio(id) {
    return fetch(API + '/api/replies/' + id + '/audio', {
      headers: { authorization: 'Bearer ' + (token || '') }
    }).then(function (r) {
      if (!r.ok) throw new Error('That recording could not be opened.');
      return r.blob();
    });
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function h(html) { var d = document.createElement('div'); d.innerHTML = String(html).trim(); return d.firstChild; }
  function when(ts) { return ts ? new Date(ts * 1000).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }) : ''; }

  function shell(inner) {
    root.innerHTML = '';
    var app = h('<div class="app"></div>');
    // One link, two chairs. The way back to your own practice is always here.
    app.appendChild(h('<div class="bar">' +
      '<a class="barlink" href="../" style="border:0;">← Your log</a>' +
      '<span class="barlab" id="tabs"></span></div>'));
    var main = h('<main></main>');
    main.appendChild(inner);
    app.appendChild(main);
    root.appendChild(app);

    var t = document.getElementById('tabs');
    [['inbox', 'Asked'], ['notes', 'Notes'], ['people', 'People']].forEach(function (p, i) {
      var b = h('<button class="barlink" style="' + (tab === p[0] ? 'color:var(--you);' : '') +
        (i ? 'margin-left:16px;' : '') + '">' + p[1] + '</button>');
      b.addEventListener('click', function () { tab = p[0]; render(); });
      t.appendChild(b);
    });
  }

  function render() {
    if (!token) {
      return shell(h('<div class="centre"><h1 class="h1">This opens from your own link.</h1>' +
        '<p class="body">The host link is the one seeded with <code>--host</code>.</p></div>'));
    }
    shell(h('<div class="pad"><p class="small">Loading…</p></div>'));
    var opening = tab === 'inbox' ? inbox() : tab === 'notes' ? notes() : people();
    opening.catch(function (e) {
      shell(h('<div class="pad"><p class="small">' + esc(e.message) +
        ' — this link may not be a host link.</p></div>'));
    });
  }

  // -------------------------------------------------------------------------
  function inbox() {
    return api('/api/host/inbox').then(function (d) {
      var wrap = h('<div class="rows" style="flex:1;"></div>');
      if (!d.messages.length) wrap.appendChild(h('<div><p class="small">Nothing asked yet.</p></div>'));

      d.messages.forEach(function (m) {
        var row = h('<div style="display:grid;gap:12px;"></div>');
        row.appendChild(h('<div class="caps">' + esc(m.name) + ' · ' + esc(when(m.created_at)) +
          (m.reply ? ' · replied' : '') + '</div>'));
        row.appendChild(h('<p class="body">' + esc(m.body) + '</p>'));

        row.appendChild(m.reply
          ? savedReply(m.reply)
          : replyForm({ type: 'message', message_id: m.id }));
        wrap.appendChild(row);
      });

      shell(wrap);
    });
  }

  function notes() {
    return api('/api/host/notes').then(function (d) {
      var wrap = h('<div class="rows" style="flex:1;"></div>');
      if (!d.notes.length) wrap.appendChild(h('<div><p class="small">No practice notes yet.</p></div>'));

      d.notes.forEach(function (note) {
        var row = h('<div style="display:grid;gap:12px;"></div>');
        row.appendChild(h('<div class="caps">' + esc(note.name) + ' · ' + esc(note.on_date) +
          (note.reply ? ' · replied' : '') + '</div>'));
        row.appendChild(h('<p class="body">“' + esc(note.body) + '”</p>'));
        row.appendChild(note.reply
          ? savedReply(note.reply)
          : replyForm({ type: 'note', person_id: note.person_id, note_date: note.on_date }));
        wrap.appendChild(row);
      });

      shell(wrap);
    });
  }

  function replyForm(source) {
    var box = h('<div class="host-reply-form" style="display:grid;gap:12px;padding-top:8px;">' +
      '<div class="caps">Reply</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;" role="group" aria-label="Who can see this reply">' +
        '<button class="chip sel" data-vis="private" aria-pressed="true">Just for them</button>' +
        '<button class="chip" data-vis="shared" aria-pressed="false">Share with everyone</button>' +
      '</div>' +
      '<div class="public-context" hidden>' +
        '<label class="small">Your question or context — this is all everyone else sees</label>' +
        '<textarea class="field" rows="2" maxlength="500" placeholder="Write the question or context in your own words. Their original stays private."></textarea>' +
      '</div>' +
      '<textarea class="field reply-body" rows="3" maxlength="4000" placeholder="Write a reply, record one, or do both."></textarea>' +
      '<div class="host-recorder" style="display:grid;gap:10px;">' +
        '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">' +
          '<button class="ul record">Record a voice reply</button>' +
          '<button class="ul stop" hidden>Stop recording</button>' +
          '<span class="small timer">Up to 20 minutes</span>' +
        '</div>' +
        '<div class="recording-preview"></div>' +
      '</div>' +
      '<button class="btn send-reply">Send reply</button>' +
      '<p class="small reply-message" aria-live="polite"></p>' +
    '</div>');

    var visibility = 'private';
    var contextWrap = box.querySelector('.public-context');
    var context = contextWrap.querySelector('textarea');
    var body = box.querySelector('.reply-body');
    var record = box.querySelector('.record');
    var stop = box.querySelector('.stop');
    var timer = box.querySelector('.timer');
    var preview = box.querySelector('.recording-preview');
    var message = box.querySelector('.reply-message');
    var recording = null;
    var recordingMs = 0;
    var recorder = null;
    var stream = null;
    var tick = null;
    var cutoff = null;
    var started = 0;
    var previewUrl = null;

    [].forEach.call(box.querySelectorAll('[data-vis]'), function (button) {
      button.addEventListener('click', function () {
        visibility = button.getAttribute('data-vis');
        [].forEach.call(box.querySelectorAll('[data-vis]'), function (other) {
          var selected = other === button;
          other.classList.toggle('sel', selected);
          other.setAttribute('aria-pressed', selected ? 'true' : 'false');
        });
        contextWrap.hidden = visibility !== 'shared';
        if (visibility === 'shared') context.focus();
      });
    });

    record.addEventListener('click', function () {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
        message.textContent = 'This browser cannot record audio here.';
        return;
      }
      message.textContent = 'Opening the microphone…';
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (opened) {
        stream = opened;
        var types = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg;codecs=opus'];
        var mime = '';
        for (var i = 0; i < types.length; i++) {
          if (!MediaRecorder.isTypeSupported || MediaRecorder.isTypeSupported(types[i])) { mime = types[i]; break; }
        }
        try {
          recorder = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 48000 } : { audioBitsPerSecond: 48000 });
        } catch (error) {
          recorder = new MediaRecorder(stream);
        }
        var chunks = [];
        recorder.addEventListener('dataavailable', function (event) {
          if (event.data && event.data.size) chunks.push(event.data);
        });
        recorder.addEventListener('stop', function () {
          clearInterval(tick); clearTimeout(cutoff);
          if (stream) stream.getTracks().forEach(function (track) { track.stop(); });
          recordingMs = Math.min(MAX_RECORDING_MS, Math.max(1, Date.now() - started));
          recording = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
          if (previewUrl) URL.revokeObjectURL(previewUrl);
          previewUrl = URL.createObjectURL(recording);
          preview.innerHTML = '';
          var player = document.createElement('audio');
          player.controls = true; player.preload = 'metadata'; player.src = previewUrl;
          player.setAttribute('controlsList', 'nodownload');
          preview.appendChild(player);
          var remove = h('<button class="ul" style="margin-left:12px;">Remove recording</button>');
          remove.addEventListener('click', function () {
            recording = null; recordingMs = 0;
            if (previewUrl) URL.revokeObjectURL(previewUrl);
            previewUrl = null; preview.innerHTML = '';
            record.textContent = 'Record a voice reply';
            timer.textContent = 'Up to 20 minutes';
          });
          preview.appendChild(remove);
          record.hidden = false; record.textContent = 'Record again'; stop.hidden = true;
          timer.textContent = formatDuration(recordingMs);
          message.textContent = 'Recording ready.';
        });
        recorder.start(1000);
        started = Date.now();
        record.hidden = true; stop.hidden = false;
        message.textContent = 'Recording…';
        tick = setInterval(function () { timer.textContent = formatDuration(Date.now() - started) + ' / 20:00'; }, 250);
        cutoff = setTimeout(function () { if (recorder && recorder.state === 'recording') recorder.stop(); }, MAX_RECORDING_MS);
      }).catch(function () {
        message.textContent = 'The microphone could not be opened.';
      });
    });

    stop.addEventListener('click', function () {
      if (recorder && recorder.state === 'recording') recorder.stop();
    });

    box.querySelector('.send-reply').addEventListener('click', function () {
      var button = this;
      if (!body.value.trim() && !recording) { message.textContent = 'Write or record something first.'; return; }
      if (visibility === 'shared' && !context.value.trim()) {
        message.textContent = 'Write the public question or context first.'; context.focus(); return;
      }

      var form = new FormData();
      form.append('source_type', source.type);
      if (source.type === 'message') form.append('message_id', String(source.message_id));
      if (source.type === 'note') {
        form.append('person_id', String(source.person_id));
        form.append('note_date', source.note_date);
      }
      form.append('visibility', visibility);
      form.append('context', context.value.trim());
      form.append('body', body.value.trim());
      if (recording) {
        form.append('audio', recording, recording.type.indexOf('mp4') > -1 ? 'reply.m4a' : 'reply.webm');
        form.append('audio_ms', String(recordingMs));
      }

      button.disabled = true;
      message.textContent = 'Sending…';
      apiForm('/api/host/reply', form).then(function (result) {
        message.textContent = result.mailed ? 'Saved, and they were emailed.' : 'Saved. Their email did not go.';
        setTimeout(render, 700);
      }).catch(function (error) {
        button.disabled = false;
        message.textContent = error.message || 'That did not go through.';
      });
    });

    return box;
  }

  function savedReply(reply) {
    var box = h('<div class="frame" style="display:grid;gap:10px;">' +
      '<div class="caps">' + (reply.visibility === 'shared' ? 'Shared with everyone' : 'Just for them') + '</div>' +
      (reply.context ? '<p class="body"><b>Public context:</b> ' + esc(reply.context) + '</p>' : '') +
      (reply.body ? '<p class="body">' + esc(reply.body) + '</p>' : '') +
      '<div class="saved-audio"></div>' +
      '<div class="reply-sharing" hidden style="display:grid;gap:8px;">' +
        '<textarea class="field" rows="2" maxlength="500" placeholder="The question or context everyone will see.">' + esc(reply.context || '') + '</textarea>' +
        '<button class="ul save-sharing">Share with everyone</button>' +
      '</div>' +
      '<div style="display:flex;gap:14px;flex-wrap:wrap;">' +
        (reply.visibility === 'shared'
          ? '<button class="ul make-private">Make private</button><button class="ul edit-context">Change public context</button>'
          : '<button class="ul make-shared">Share with everyone</button>') +
        '<button class="ul danger-link remove-reply">Remove reply</button>' +
      '</div>' +
      '<p class="small saved-message" aria-live="polite"></p>' +
    '</div>');

    var audio = box.querySelector('.saved-audio');
    if (reply.legacy_audio) {
      audio.appendChild(h('<a class="ul" href="' + esc(reply.legacy_audio) + '" target="_blank" rel="noopener">Listen</a>'));
    } else if (reply.has_audio) {
      var listen = h('<button class="ul">Listen</button>');
      listen.addEventListener('click', function () {
        listen.disabled = true; listen.textContent = 'Opening…';
        var ready = hostAudioUrls[reply.id] ? Promise.resolve(hostAudioUrls[reply.id]) : apiAudio(reply.id).then(function (blob) {
          var url = URL.createObjectURL(blob); hostAudioUrls[reply.id] = url; return url;
        });
        ready.then(function (url) {
          var player = document.createElement('audio');
          player.controls = true; player.preload = 'metadata'; player.src = url;
          player.setAttribute('controlsList', 'nodownload');
          audio.innerHTML = ''; audio.appendChild(player);
        }).catch(function () { listen.disabled = false; listen.textContent = 'Try listening again'; });
      });
      audio.appendChild(listen);
    }

    var sharing = box.querySelector('.reply-sharing');
    var sharingText = sharing.querySelector('textarea');
    var message = box.querySelector('.saved-message');
    function openSharing() { sharing.hidden = false; sharingText.focus(); }
    var makeShared = box.querySelector('.make-shared');
    var editContext = box.querySelector('.edit-context');
    if (makeShared) makeShared.addEventListener('click', openSharing);
    if (editContext) editContext.addEventListener('click', openSharing);
    box.querySelector('.save-sharing').addEventListener('click', function () {
      if (!sharingText.value.trim()) { message.textContent = 'Write the public context first.'; return; }
      this.disabled = true; message.textContent = 'Saving…';
      api('/api/host/reply/visibility', {
        method: 'POST', body: { id: reply.id, visibility: 'shared', context: sharingText.value.trim() }
      }).then(render).catch(function (error) { message.textContent = error.message; });
    });
    var makePrivate = box.querySelector('.make-private');
    if (makePrivate) makePrivate.addEventListener('click', function () {
      this.disabled = true; message.textContent = 'Saving…';
      api('/api/host/reply/visibility', {
        method: 'POST', body: { id: reply.id, visibility: 'private', context: '' }
      }).then(render).catch(function (error) { message.textContent = error.message; });
    });
    box.querySelector('.remove-reply').addEventListener('click', function () {
      if (!confirm('Remove this reply and its recording?')) return;
      this.disabled = true; message.textContent = 'Removing…';
      api('/api/host/reply/remove', { method: 'POST', body: { id: reply.id } })
        .then(render).catch(function (error) { message.textContent = error.message; });
    });
    return box;
  }

  function formatDuration(ms) {
    var seconds = Math.max(0, Math.floor(ms / 1000));
    var minutes = Math.floor(seconds / 60);
    return String(minutes).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
  }

  // -------------------------------------------------------------------------
  // The mutual yes, made into a link. Creates the row but not the person: they
  // are not one of the ten, not on the roster and cannot sign in until they
  // accept. The link comes back either way, so it can be sent by hand instead.
  function inviteForm() {
    var box = h('<div style="display:grid;gap:10px;">' +
      '<div class="caps">Invite someone</div>' +
      '<input class="field" id="iname" placeholder="Their name" autocomplete="off">' +
      '<input class="field" id="imail" placeholder="Their email" autocomplete="off" inputmode="email">' +
      '<label style="display:flex;align-items:center;gap:10px;" class="small">' +
        '<input type="checkbox" id="isend" checked> Email the invitation from me' +
      '</label>' +
      '<button class="btn" id="isubmit">Send the invitation</button>' +
      '<p class="small" id="imsg" aria-live="polite"></p></div>');

    box.querySelector('#isubmit').addEventListener('click', function () {
      var name = box.querySelector('#iname').value.trim();
      var email = box.querySelector('#imail').value.trim();
      var send = box.querySelector('#isend').checked;
      var msg = box.querySelector('#imsg');

      if (!name || !email) { msg.textContent = 'Both a name and an email.'; return; }
      this.disabled = true;
      msg.textContent = 'Sending…';

      api('/api/host/invite', { method: 'POST', body: { name: name, email: email, send: send } })
        .then(function (r) {
          box.querySelector('#isubmit').disabled = false;
          if (r.full) { msg.textContent = r.message; return; }
          box.querySelector('#iname').value = '';
          box.querySelector('#imail').value = '';
          // Shown whether or not it was emailed — an invitation that bounced
          // is still an invitation, and John can paste it into his own note.
          msg.innerHTML = (r.mailed ? 'Sent. ' : 'Not emailed. ') +
            'Their link: <span style="word-break:break-all;">' + esc(r.url) + '</span>';
          render();
        })
        .catch(function (e) {
          box.querySelector('#isubmit').disabled = false;
          msg.textContent = e.message;
        });
    });
    return box;
  }

  function people() {
    return api('/api/host/people').then(function (d) {
      var wrap = h('<div class="rows" style="flex:1;"></div>');
      wrap.appendChild(h('<div><div class="caps">' + esc(d.run.name) + ' · ' + esc(d.run.mode) + '</div></div>'));
      // The main log has its own public front door. Invitations remain only
      // for old private runs; showing one here would recreate the course-copy
      // model the public log replaced.
      if (!d.run.public_join) wrap.appendChild(inviteForm());

      d.people.forEach(function (p) {
        var bits = [p.email, p.timezone, 'joined ' + p.joined_on];
        if (p.is_host) bits.push('host');
        if (p.left_at) bits.push('left ' + p.left_at);
        if (!p.nudge_on) bits.push('nudges off');
        if (p.message_from && p.message_until) bits.push('John line ' + p.message_from + ' to ' + p.message_until);

        var image = p.profile_image
          ? '<span class="profile-preview"><img src="' + esc(p.profile_image) + '" alt=""></span>'
          : '<span class="profile-preview fallback">' + esc(String(p.name || '').trim().charAt(0).toUpperCase() || '·') + '</span>';
        var row = h('<div class="rowflex"><div style="display:flex;gap:14px;align-items:flex-start;min-width:0;">' +
          image + '<div><b>' + esc(p.name) + '</b>' +
          '<p>' + esc(bits.join(' · ')) + '</p>' +
          (p.line ? '<p>“' + esc(p.line) + '”</p>' : '') +
          '<p>' + p.marks + (p.marks === 1 ? ' day marked' : ' days marked') +
            (p.last_mark ? ' · last ' + esc(p.last_mark) : '') + '</p>' +
          '</div></div><div style="text-align:right;flex:none;">' +
          (p.quiet_days >= 3
            ? '<span class="caps" style="color:var(--you);">quiet ' + p.quiet_days + 'd</span>'
            : '<span class="caps">&nbsp;</span>') +
          '</div></div>');

        // Removing a note. The person's mark stays and they are not told.
        var rm = h('<div style="display:flex;gap:8px;margin-top:10px;align-items:center;">' +
          '<input class="field" style="max-width:11rem;padding:8px 10px;font-size:15px;" placeholder="YYYY-MM-DD">' +
          '<button class="ul">Remove that day’s note</button>' +
          '<span class="small" aria-live="polite"></span></div>');
        var input = rm.querySelector('input');
        var say = rm.querySelector('span');
        rm.querySelector('button').addEventListener('click', function () {
          var date = input.value.trim();
          if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { say.textContent = 'Wants YYYY-MM-DD.'; return; }
          api('/api/host/note/remove', { method: 'POST', body: { person_id: p.id, date: date } })
            .then(function () { say.textContent = 'Removed. Their mark stays.'; })
            .catch(function (e) { say.textContent = e.message; });
        });
        row.appendChild(rm);

        if (!p.is_host) {
          var access = h('<div style="display:grid;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--hair);">' +
            '<div class="caps">Private line during a course</div>' +
            '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">' +
              '<input class="field afrom" type="date" style="max-width:11rem;padding:8px 10px;font-size:15px;" aria-label="Course access starts">' +
              '<span class="small">to</span>' +
              '<input class="field auntil" type="date" style="max-width:11rem;padding:8px 10px;font-size:15px;" aria-label="Course access ends">' +
              '<button class="ul asave">Save access</button>' +
              '<button class="ul aclear">Clear</button>' +
              '<span class="small amsg" aria-live="polite"></span>' +
            '</div></div>');
          var from = access.querySelector('.afrom');
          var until = access.querySelector('.auntil');
          var amsg = access.querySelector('.amsg');
          from.value = p.message_from || '';
          until.value = p.message_until || '';

          access.querySelector('.asave').addEventListener('click', function () {
            if (!from.value || !until.value) { amsg.textContent = 'Both dates.'; return; }
            this.disabled = true;
            api('/api/host/message-access', {
              method: 'POST', body: { person_id: p.id, from: from.value, until: until.value }
            }).then(function () { amsg.textContent = 'Saved.'; render(); })
              .catch(function (e) { amsg.textContent = e.message; });
          });
          access.querySelector('.aclear').addEventListener('click', function () {
            this.disabled = true;
            api('/api/host/message-access', {
              method: 'POST', body: { person_id: p.id, from: null, until: null }
            }).then(function () { amsg.textContent = 'Cleared.'; render(); })
              .catch(function (e) { amsg.textContent = e.message; });
          });
          row.appendChild(access);
        }
        wrap.appendChild(row);
      });

      shell(wrap);
    });
  }

  render();
})();
</script>
</body>
</html>
