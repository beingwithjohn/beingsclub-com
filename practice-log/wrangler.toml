name = "practice-log"
main = "src/index.js"
compatibility_date = "2025-05-01"

# Half-hourly, so a 6:30am nudge lands at 6:30am wherever the person is.
# One trigger, not one per timezone. See src/nudge.js.
[triggers]
crons = ["0,30 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "practice-log"
# `wrangler d1 create practice-log` prints this. Paste it here; it is not a secret.
database_id = "8cf3af32-666c-48fb-a943-9c38c393d24c"

# Beings Club membership is deliberately kept out of the Practice Log data.
# The two currently share this Worker only so member codes can use the already
# configured mail sender without copying a secret into another service.
[[d1_databases]]
binding = "MEMBERS"
database_name = "beings-club-members"
database_id = "c82c1c04-9378-4642-874f-0c8eb3be3f55"
migrations_dir = "members-migrations"

# Private voice replies. The bucket has no public domain; audio is returned
# only through an authenticated Practice Log request.
[[r2_buckets]]
binding = "AUDIO"
bucket_name = "practice-log-audio"

# Private member profile and Field Note images. The bucket has no public
# domain; images are returned only through authenticated member requests.
[[r2_buckets]]
binding = "MEMBER_MEDIA"
bucket_name = "beings-club-member-media"

[vars]
# The app's own origin. The API only accepts browser calls from here.
# Comma-separated for more than one. An entry may end in `:*` to allow any port
# on that host, which is only ever useful in .dev.vars — keep this one exact.
APP_ORIGIN = "https://beingsclub.com"
APP_URL = "https://beingsclub.com/log/"
GIVING_URL = "https://beingsclub.com/giving/"

# From-lines. beingsclub.com cannot receive mail (no MX, SPF is deny-all),
# so every send carries a reply-to that can. See README "Sending domain".
MAIL_FROM = "Beings Club <practice@beingsclub.com>"
MAIL_FROM_HOST = "John Ooi <practice@beingsclub.com>"
MAIL_REPLY_TO = "john@spacetobe.xyz"
HOST_NOTIFY_EMAIL = "john@spacetobe.xyz"
ZOOM_HOST_USER_ID = "john@spacetobe.xyz"

# Secrets — set with `wrangler secret put`, never written here:
#   RESEND_API_KEY   the Resend key
#   LINK_KEY         32 random bytes, base64. Seals the magic links at rest, so
#                    a copy of the database is not a set of live logins.
#                    Generate: openssl rand -base64 32
#   STRIPE_SECRET_KEY      optional. Without it the giving page says so
#                          politely and nothing else changes.
#   STRIPE_WEBHOOK_SECRET  from the Stripe dashboard, for /api/stripe/webhook
#   CAL_WEBHOOK_SECRET     secret chosen for the Cal.com booking webhook
#   ZOOM_ACCOUNT_ID        Server-to-Server OAuth app account ID
#   ZOOM_CLIENT_ID         Server-to-Server OAuth app client ID
#   ZOOM_CLIENT_SECRET     Server-to-Server OAuth app client secret
